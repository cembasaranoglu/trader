# Local Docker Compose config: configs/example.yaml with container paths.
# The connection strings come from TRADER_STORE_DSN / TRADER_STORE_MIGRATE_DSN
# (local database only). Keep in sync with the example (tested).
# Example configuration. Values are the ones approved in decision D-16.
# This file contains no secrets. API keys are never stored in config files.
# Every key is required; the loader rejects unknown keys and has no defaults.

mode: paper                     # paper | live_small | live_full

venue:
  primary: binance              # D-17: binance.com (only supported primary venue)
  secondary: btcturk
  secondary_enabled: false      # BtcTurk adapter arrives in W9

quote_currency: USDT            # binance.com USDT pairs

capital:
  planned_usd: 200
  live_small_max_usd: 200       # D-16: the whole planned capital

risk:
  max_drawdown_pct: 30          # D-11: must be >= 30
  on_max_dd: close_all          # close_all | hold_stops
  max_daily_loss_pct: 3
  max_weekly_loss_pct: 7
  max_order_notional_usd: 40
  max_daily_turnover_pct: 50
  max_venue_exposure_pct: 100   # 60 once BtcTurk is enabled
  fx_shock_pct: 3               # quote currency shock guard (USDT/USD depeg for binance)
  per_trade_risk_pct: 0.5
  max_position_pct: 20
  max_gross_exposure_pct: 80
  price_collar_bps: 50
  max_data_age_ms: 5000
  max_orders_per_min: 10
  max_entries_per_window:
    count: 3
    window: 60m
  cash_reserve_pct: 5
  min_edge_to_cost_ratio: 2
  reconcile_tolerance_steps: 1
  reconcile_escalate_cycles: 3

execution:
  stp_mode: EXPIRE_TAKER        # EXPIRE_TAKER | EXPIRE_MAKER | EXPIRE_BOTH

ops:
  max_clock_skew_ms: 500
  heartbeat_timeout_s: 30

marketdata:
  depth_limit: 1000             # REST snapshot levels; weight 50 (1001-5000 costs 250)
  kline_intervals: [1m, 1h, 4h, 1d]   # initial set; W3 research may change it
  reconnect_max_backoff_s: 60

store:                          # PostgreSQL 16+ (ADR-007); paths relative to this file
  dsn_file: /run/secrets/db-app.dsn    # application role connection string, chmod 600 (local Docker: env TRADER_STORE_DSN)
  migrate_dsn_file: /run/secrets-owner/db-owner.dsn  # owner role, used only by 'traderd store migrate' (local Docker: env TRADER_STORE_MIGRATE_DSN)
  app_role: trader_app
  anchor_path: /var/lib/trader/trader.anchor
  export_dir: /var/lib/trader/exports

llm:
  cost_cap_pct_of_capital: 1    # D-13: live cap = this % of current capital per month
  rnd_monthly_cap_usd: 50       # D-16: paper / R&D cap
  models:
    routine: claude-haiku-5-5
    synthesis: claude-sonnet-5-5

agents:
  events:
    enabled: true
    max_calls_per_day: 40
  regime:
    enabled: true
    max_calls_per_day: 8
  thesis:
    enabled: true
    max_calls_per_day: 20
    max_escalations_per_day: 2
  critic:
    enabled: true
    max_calls_per_day: 20
  reflection:
    enabled: true

learning:
  min_supporting_trades: 30
  max_param_delta_pct: 10

gates:
  paper_min_days: 60
  g2_min_days: 180
  edge_cost_multiple: 2         # D-13, tested on a lower confidence bound (D-14)
  infra_monthly_usd: 0          # VPS + database per month, added to the gate's cost side (2026-11-19); set from the first invoice after provisioning
